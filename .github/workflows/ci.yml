name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Enable corepack (pnpm version from package.json)
        run: corepack enable
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: pnpm
      - name: Install from lockfile
        run: pnpm install --frozen-lockfile
      - name: Dependency audit (high and critical)
        run: pnpm audit --audit-level=high
      - name: Format check
        run: pnpm format:check
      - name: Build
        run: pnpm build
      - name: Lint
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      # Real PostgreSQL, Redis, MinIO and Mailpit — no external services, no cloud credentials.
      - name: Start local services
        run: docker compose up -d --wait postgres redis minio mailpit
      - name: Unit and integration tests
        run: pnpm test
      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium
      - name: End-to-end test (fresh install -> Mailpit)
        run: pnpm test:e2e
      - name: Upload Playwright traces
        if: failure()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7
      - name: Service logs on failure
        if: failure()
        run: docker compose logs --no-color --tail 200

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build images (not pushed)
        run: |
          docker build -f docker/Dockerfile --target api -t opensend-api:ci .
          docker build -f docker/Dockerfile --target worker -t opensend-worker:ci .
          docker build -f docker/Dockerfile --target web -t opensend-web:ci .
