name: Feature request
description: Propose a user-facing or operational improvement
title: '[Feature]: '
labels: [enhancement, needs-triage]
body:
  - type: markdown
    attributes:
      value: Describe the problem before the solution. Do not include customer data, secrets, or private production details.
  - type: textarea
    id: problem
    attributes:
      label: Problem to solve
      description: Who is blocked, and what outcome is difficult today?
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Proposed behavior
      description: Describe the observable behavior, including tenant, provider or operational boundaries.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Workarounds, other designs, or reasons to leave the behavior unchanged.
    validations:
      required: true
  - type: dropdown
    id: user_type
    attributes:
      label: Affected user type
      multiple: true
      options:
        - Application developer
        - Agency operator
        - SaaS platform team
        - OpenSend instance operator
        - Organization owner/admin
        - End recipient
    validations:
      required: true
  - type: textarea
    id: safety
    attributes:
      label: Security, tenancy and migration considerations
      description: Note new permissions, cross-tenant risks, provider behavior, data retention, configuration or migrations.
